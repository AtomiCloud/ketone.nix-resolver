name: Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Only changes that alter the published artifact; docs, specs and fixtures do not publish.
    paths:
      - 'index.ts'
      - 'cyan/**'
      - 'cyan.yaml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'types/**'
      - 'README.MD'
      - '.github/workflows/🚀publish.yaml'
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ github.event_name == 'pull_request' && 'Publish (dry run)' || 'Publish' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CYANPRINT_VERSION: 4.9.2
      # sulfone.lite commit tagged v4.9.2; pinned so a moved tag cannot change the publisher.
      CYANPRINT_COMMIT: 091f18f12af93dc10812ac8b0c955aafe43e1a00
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      # The v4.9.2 release binaries are built under Nix and point their ELF interpreter into
      # /nix/store, so they cannot run on a plain runner. Run the CLI from its tagged source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AtomiCloud/sulfone.lite
          ref: ${{ env.CYANPRINT_COMMIT }}
          path: .cyanprint-src
          persist-credentials: false

      - name: Install cyanprint
        run: |
          mv .cyanprint-src "$RUNNER_TEMP/cyanprint-src"
          (cd "$RUNNER_TEMP/cyanprint-src" && bun install --frozen-lockfile --production --ignore-scripts)
          mkdir -p "$RUNNER_TEMP/cyanprint-bin"
          printf '#!/usr/bin/env bash\nexec bun run "%s/cyanprint-src/packages/cli/src/main.ts" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/cyanprint-bin/cyanprint"
          chmod +x "$RUNNER_TEMP/cyanprint-bin/cyanprint"
          echo "$RUNNER_TEMP/cyanprint-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cyanprint-bin/cyanprint" --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate (dry run)
        if: github.event_name == 'pull_request'
        run: cyanprint push . --dry-run

      # Runs can start out of order. Publish only if no newer commit on main changes the
      # artifact: such a commit has its own run, which publishes the newer artifact instead.
      # A newer docs-only commit does not trigger a run, so this run still publishes.
      - name: Decide whether to publish
        id: tip
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          [ -n "$tip" ]
          publish=true
          if [ "$tip" != "$GITHUB_SHA" ]; then
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${tip}" --paginate --jq '.files[].filename')"
            if printf '%s\n' "$changed" | grep -Eq '^(index\.ts$|cyan/|cyan\.yaml$|package\.json$|bun\.lock$|tsconfig\.json$|types/|README\.MD$|\.github/workflows/🚀publish\.yaml$)'; then
              echo "::notice::a newer commit on main ($tip) changes the artifact; its run publishes instead"
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish to the registry
        if: steps.tip.outputs.publish == 'true'
        env:
          CYANPRINT_TOKEN: ${{ secrets.CYAN_TOKEN }}
        run: cyanprint push .
